name: Release preview

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-git-sources:
    uses: storytold/craft-common-actions/.github/workflows/git-sources.yml@4ec2a14646b538253fd5ebe109bf463a3d31b061

  preview-build:
    needs: preview-git-sources
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@4ec2a14646b538253fd5ebe109bf463a3d31b061
    with:
      os: '["ubuntu-24.04","macos-15","windows-2025"]'
      packages: libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      craft-fonts-ref: ""
      targets: ""
      tools: ""
      artifact-name: assetcraft-preview
      artifact-path: target/release-preview/packages/
      command: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) platform=linux-x86_64; extension= ;;
          macOS/ARM64) platform=macos-aarch64; extension= ;;
          Windows/X64) platform=windows-x86_64; extension=.exe ;;
          *) echo "Unsupported runner $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        build_dir=release
        if [[ "$RUNNER_OS" == Windows ]]; then
          target=x86_64-pc-windows-msvc
          RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }-C target-feature=+crt-static" \
            cargo build --release --locked --features desktop --bins --target "$target"
          build_dir="$target/release"
        else
          cargo build --release --locked --features desktop --bins
        fi
        mkdir -p target/release-preview/{staging,packages}
        cd target/release-preview
        cp ../../LICENSE ../../NOTICE ../../ATTRIBUTION.md ../../README.md staging/
        cp "../$build_dir/assetcraft-cli$extension" "../$build_dir/assetcraft-desktop$extension" staging/
        "./staging/assetcraft-cli$extension" --help
        if [[ "$RUNNER_OS" == Windows ]]; then
          powershell.exe -NoProfile -NonInteractive -Command \
            '$ErrorActionPreference = "Stop"; Compress-Archive -Path staging/* -DestinationPath packages/assetcraft-windows-x86_64.zip -Force; Expand-Archive -Path packages/assetcraft-windows-x86_64.zip -DestinationPath extracted -Force'
          for executable in extracted/assetcraft-{cli,desktop}.exe; do
            imports=$(llvm-objdump -p "$executable")
            if grep -Ei 'DLL Name:[[:space:]]*(vcruntime|msvcp|concrt|vcomp)' <<<"$imports"; then
              echo "$executable requires a Visual C++ runtime DLL" >&2
              exit 1
            fi
          done
        else
          tar -czf "packages/assetcraft-$platform.tar.gz" -C staging .
        fi

  publish-prerelease:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: preview-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assetcraft-preview-*
          path: release-assets
          merge-multiple: true
      - name: Publish the verified tag and archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$TAG" != "v$version" ]]; then
            echo "Tag $TAG must match the AssetCraft version v$version" >&2
            exit 1
          fi
          cd release-assets
          archives=(assetcraft-linux-x86_64.tar.gz assetcraft-macos-aarch64.tar.gz assetcraft-windows-x86_64.zip)
          sha256sum "${archives[@]}" > SHA256SUMS
          gh release create "$TAG" --verify-tag --prerelease --title "AssetCraft $TAG" \
            --notes 'Unsigned preview builds for Linux x64, macOS Apple Silicon, and Windows x64. Each archive includes the desktop app, CLI, and license notices. Extract the archive before running a binary. The assets are accompanied by SHA-256 checksums.' \
            "${archives[@]}" SHA256SUMS
