name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@4ec2a14646b538253fd5ebe109bf463a3d31b061
    with:
      os: '["ubuntu-24.04"]'
      packages: libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      craft-fonts-ref: ""
      targets: ""
      tools: ""
      command: |
        set -e
        cargo fmt --all -- --check
        cargo clippy --locked --features desktop --all-targets -- -D warnings
        cargo test --locked --features desktop
